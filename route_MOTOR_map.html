    <style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {
	background-image: url(images/layers.png);
	width: 36px;
	height: 36px;
	}
.leaflet-retina .leaflet-control-layers-toggle {
	background-image: url(images/layers-2x.png);
	background-size: 26px 26px;
	}
.leaflet-touch .leaflet-control-layers-toggle {
	width: 44px;
	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,
.leaflet-control-layers-expanded .leaflet-control-layers-toggle {
	display: none;
	}
.leaflet-control-layers-expanded .leaflet-control-layers-list {
	display: block;
	position: relative;
	}
.leaflet-control-layers-expanded {
	padding: 6px 10px 6px 6px;
	color: #333;
	background: #fff;
	}
.leaflet-control-layers-scrollbar {
	overflow-y: scroll;
	overflow-x: hidden;
	padding-right: 5px;
	}
.leaflet-control-layers-selector {
	margin-top: 2px;
	position: relative;
	top: 1px;
	}
.leaflet-control-layers label {
	display: block;
	font-size: 13px;
	font-size: 1.08333em;
	}
.leaflet-control-layers-separator {
	height: 0;
	border-top: 1px solid #ddd;
	margin: 5px -10px 5px -6px;
	}

/* Default icon URLs */
.leaflet-default-icon-path { /* used only in path-guessing heuristic, see L.Icon.Default */
	background-image: url(images/marker-icon.png);
	}


/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;

	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);
	background-clip: padding-box;
	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;
	border-radius: 12px;
	}
.leaflet-popup-content {
	margin: 13px 24px 13px 20px;
	line-height: 1.3;
	font-size: 13px;
	font-size: 1.08333em;
	min-height: 1px;

      function updateCell5LocationVisual(pos, recenter) {
        try {
          const lat = Number(pos.coords.latitude);

          const accuracy = Math.max(0, Number(pos.coords.accuracy || 0));
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

          cell5LocationState.last = {lat: lat, lon: lon, accuracy: accuracy};

          if (!cell5LocationState.marker) {
            cell5LocationState.marker = L.marker([lat, lon], {
              icon: L.divIcon({
                className: '',
                html: '<div class="cell5-user-location-marker"></div>',
                iconSize: [18,18],
                iconAnchor: [9,9]
              }),
              zIndexOffset: 60000000,
              interactive: false,
              keyboard: false
            }).addTo(mapObj);
          } else {
            cell5LocationState.marker.setLatLng([lat, lon]);
          }

          if (!cell5LocationState.accuracy) {
            cell5LocationState.accuracy = L.circle([lat, lon], {
              radius: accuracy,
              color: '#1a73e8',
              weight: 1,
              opacity: .32,
              fillColor: '#1a73e8',
              fillOpacity: .07,
              interactive: false
            }).addTo(mapObj);
          } else {
            cell5LocationState.accuracy.setLatLng([lat, lon]);
            cell5LocationState.accuracy.setRadius(accuracy);
          }

          if (recenter || cell5LocationState.firstFix) {
            mapObj.setView([lat, lon], Math.max(mapObj.getZoom(), 16), {animate:true});
            cell5LocationState.firstFix = false;
          }
        } catch(e) {
          try { console.warn('Cell5 目前位置更新失敗', e); } catch(_) {}
        }

      window.cell5StartLocation = function(recenter) {

          if (cell5LocationState.watchId !== null) {

          const opts = {

          cell5LocationState.watchId = navigator.geolocation.watchPosition(
            function(pos) {

            function(err) {

          try{if(mapObj.hasLayer(layer))mapObj.removeLayer(layer);}catch(e){}
        }
      });

      if(savedBase.length){
        layerItems.filter(function(item){return item&&item.type==='base';}).forEach(function(item){
          const base=window[item.var];
          if(base&&mapObj.hasLayer(base)&&savedBase.indexOf(base)===-1){
            try{mapObj.removeLayer(base);}catch(e){}
          }
        });
        try{if(!mapObj.hasLayer(savedBase[0]))mapObj.addLayer(savedBase[0]);}catch(e){}
      }

      const lat=Number(state.center&&state.center.lat);
      const lng=Number(state.center&&state.center.lng);
      const zoom=Number(state.zoom);
      if(Number.isFinite(lat)&&Number.isFinite(lng)&&Number.isFinite(zoom)){
        try{mapObj.setView([lat,lng],zoom,{animate:false});}catch(e){}
      }

      try{if(typeof syncLayerChecks==='function')syncLayerChecks();}catch(e){}
      try{if(typeof syncCustomLayerCheckboxes==='function')syncCustomLayerCheckboxes();}catch(e){}
      try{if(typeof syncRouteModeCheckboxes==='function')syncRouteModeCheckboxes();}catch(e){}
      try{if(typeof syncArrowVisibility==='function')syncArrowVisibility();}catch(e){}
      try{if(typeof updateSharedStartPanel==='function')updateSharedStartPanel();}catch(e){}
      return true;
    }finally{
      cell5RestoringViewState=false;
    }
  }

  try{mapObj.on('moveend zoomend overlayadd overlayremove baselayerchange',cell5ScheduleSaveViewState);}catch(e){}
  try{window.addEventListener('pagehide',cell5SaveViewState,{capture:true});}catch(e){}
  try{window.addEventListener('beforeunload',cell5SaveViewState,{capture:true});}catch(e){}

  function cell5RestoreRetry(){
    try{cell5RestoreViewState();}catch(e){}
  }
  // 最後的 runtime 之後再重試數次，兼容桌面與手機直開版的初始化時序。
  setTimeout(cell5RestoreRetry,0);
  setTimeout(cell5RestoreRetry,120);
  setTimeout(cell5RestoreRetry,500);

  function syncCell5FullscreenUi(){
    try{
      const panel=document.getElementById("cell5-custom-layer-panel");
      const inspect=document.getElementById("cell5-inspection-panel");
      const mapEl=mapObj&&mapObj.getContainer?mapObj.getContainer():null;
      if(!mapEl)return;
      const fs=document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement;
      const isMapFullscreen=(fs===mapEl);
      const moveKeep=function(el,parent){
        if(!el||!parent||el.parentElement===parent)return;
        const r=el.getBoundingClientRect();
        parent.appendChild(el);
        const pr=parent.getBoundingClientRect();
        const w=el.offsetWidth,h=el.offsetHeight;
        const maxLeft=Math.max(4,pr.width-w-4),maxTop=Math.max(4,pr.height-h-4);
        el.style.left=Math.max(4,Math.min(r.left-pr.left,maxLeft))+"px";
        el.style.top=Math.max(4,Math.min(r.top-pr.top,maxTop))+"px";
        el.style.right="auto";el.style.bottom="auto";el.style.transform="none";el.style.margin="0";
      };
      if(isMapFullscreen){
        moveKeep(panel,mapEl);moveKeep(inspect,mapEl);
        if(panel)panel.style.zIndex="2147483646";
        if(inspect)inspect.style.zIndex="2147483645";
      }else if(window.innerWidth<=700){
        moveKeep(panel,document.body);moveKeep(inspect,document.body);
        if(panel)panel.style.zIndex="";if(inspect)inspect.style.zIndex="";
      }
      try{mapObj.invalidateSize(false);}catch(e){}
    }catch(e){}
  }
  document.addEventListener("fullscreenchange",syncCell5FullscreenUi);
  document.addEventListener("webkitfullscreenchange",syncCell5FullscreenUi);
  setTimeout(syncCell5FullscreenUi,120);

  function getLayer(v){ try { return v ? window[v] : null; } catch(e){ return null; } }
  function getMarker(v){ try { return v ? window[v] : null; } catch(e){ return null; } }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function extractName(html){
    const m=String(html||'').match(/<div class="cell5-inspection-name">([\s\S]*?)<\/div>/i);
    if(!m)return '';
    const box=document.createElement('div'); box.innerHTML=m[1];
    return box.textContent || box.innerText || '';
  }
  function extractLatLon(html){
    const s=String(html||'');
    let m=s.match(/maps\/search\/\?api=1&query=([-0-9.]+),([-0-9.]+)/i);
    if(!m)m=s.match(/query=([-0-9.]+),([-0-9.]+)/i);
    if(!m)return null;
    const lat=Number(m[1]), lon=Number(m[2]);
    return Number.isFinite(lat)&&Number.isFinite(lon)?{lat,lon}:null;
  }
  function metaFor(v){
    const raw=inspectionMeta[v]||{};
    const rec=inspectionRecords[v]||'';
    const ll=extractLatLon(rec);
    return {
      lat:Number.isFinite(Number(raw.lat))?Number(raw.lat):(ll?ll.lat:NaN),
      lon:Number.isFinite(Number(raw.lon))?Number(raw.lon):(ll?ll.lon:NaN),
      name:String(raw.display_name||extractName(rec)||''),
      label:String(raw.label||''),
      point_index:raw.point_index,
      return_start_url:String(raw.return_start_url||'')
    };
  }

  // ============================================================
  // 固定起點面板：這一段位於獨立的最終 Runtime IIFE，
  // 因此不能呼叫前一個 IIFE 內部的 showStartInspectionPanel()。
  // 這裡直接建立自己的面板內容，避免作用域問題。
  // ============================================================
  function openStartPanel(){
    try{
      const panel=document.getElementById('cell5-inspection-panel');
      const body=document.getElementById('cell5-inspection-body');
      const title=document.getElementById('cell5-inspection-title');
      if(!panel||!body||!title)return false;

      let targets=[];
      let numberModeActive=false;
      try{
        const numberItem=(layerItems||[]).find(function(x){ return String(x&&x.group||'')==='number'; });
        if(numberItem && numberItem.var){
          const numberLayer=getLayer(numberItem.var);
          numberModeActive=!!(numberLayer && mapObj.hasLayer(numberLayer));
        }
      }catch(_){}

      if(!numberModeActive){
        (dailyDayTargets||[]).forEach(function(t){
          if(t&&t.first_marker_var){
            const layer=t.route_var?getLayer(t.route_var):null;
            if(layer && mapObj.hasLayer(layer)) targets.push(t);
          }
        });
        if(!targets.length && allInOneStartTarget && allInOneStartTarget.first_marker_var){
          const layer=allInOneStartTarget.route_var?getLayer(allInOneStartTarget.route_var):null;
          if(layer && mapObj.hasLayer(layer)) targets.push(allInOneStartTarget);
        }
        // 即使目前沒有勾選任何路線，也維持固定起點可開啟，並提供所有可用入口。
        if(!targets.length){
          (dailyDayTargets||[]).forEach(function(t){ if(t&&t.first_marker_var)targets.push(t); });
          if(!targets.length && allInOneStartTarget && allInOneStartTarget.first_marker_var)targets.push(allInOneStartTarget);
        }
      }

      let html='<b style="font-size:16px;">勘查順序：0｜固定起點</b><br>';
      html+='<div style="margin-top:5px;">所有分日與一次完成共用同一個固定起點。</div>';
      if(numberModeActive){
        html+='<div style="margin-top:10px;color:#666;">目前為「勘查編號」模式，固定起點僅供定位，不提供下一點選擇。</div>';
      }else if(targets.length){
        html+='<div style="margin-top:10px;font-weight:700;">下一點：</div><div class="cell5-start-day-nav">';
        targets.forEach(function(t){
          const v=String(t.first_marker_var||'');
          const label=String(t.label||t.day||'下一點');
          if(v) html+='<button type="button" class="cell5-nav-button" data-cell5-nav-marker="'+esc(v)+'">'+esc(label)+'</button>';
        });
        html+='</div>';
      }else{
        html+='<div style="margin-top:10px;color:#666;">目前沒有可用路線。</div>';
      }
      body.innerHTML=html;
      title.textContent='固定起點｜0';
      panel.classList.add('visible');
      panel.setAttribute('aria-hidden','false');
      return true;
    }catch(e){
      try{console.warn('Cell5 固定起點面板開啟失敗：',e);}catch(_){}
      return false;
    }
  }

  // 事件委派：直接從 DOM 找到「0」圖示，不依賴 Leaflet Marker click。
  // 因此 DAY／一次完成／未勾選時都使用同一套入口，圖層重新建立也不會失效。
  function bindStartDomClick(){
    if(document.__cell5SharedStartDomClickBound)return;
    document.__cell5SharedStartDomClickBound=true;
    document.addEventListener('click',function(e){
      try{
        const t=e.target&&e.target.closest?e.target.closest('.cell5-shared-start-marker'):null;
        if(!t)return;
        e.preventDefault();
        e.stopPropagation();
        if(e.stopImmediatePropagation)e.stopImmediatePropagation();
        openStartPanel();
        try{
          if(Number.isFinite(startLat)&&Number.isFinite(startLon)){
            mapObj.setView([startLat,startLon],Math.max(mapObj.getZoom(),16),{animate:true});
          }
        }catch(_){}
      }catch(err){
        try{console.warn('Cell5 固定起點 DOM 點擊處理失敗：',err);}catch(_){}
      }
    },true);
  }
  bindStartDomClick();

  // ============================================================
  // A. 勘查編號圖層：獨立綁定，並提高 marker 層級避免被 DAY 點蓋住
  // ============================================================
  function promoteNumberMarkers(layer){
    try{
      if(!layer || typeof layer.eachLayer!=='function')return;
      let n=0;
      layer.eachLayer(function(m){ if(m && m.setZIndexOffset)m.setZIndexOffset(50000000-n++); });
    }catch(e){}
  }
  function syncLayerChecks(){
    const body=document.getElementById('cell5-custom-layer-body');
    if(!body)return;
    body.querySelectorAll('.cell5-layer-row').forEach(function(row){
      const input=row.querySelector('input');
      const layer=getLayer(row.getAttribute('data-layer-var')||'');
      if(input&&layer)input.checked=mapObj.hasLayer(layer);
    });
  }
  function bindLayerControls(){
    const body=document.getElementById('cell5-custom-layer-body');
    if(!body)return false;
    body.querySelectorAll('.cell5-layer-row').forEach(function(row){
      const input=row.querySelector('input');
      if(!input || input.dataset.cell5FinalBound==='1')return;
      input.dataset.cell5FinalBound='1';
      input.addEventListener('change',function(e){
        e.stopPropagation();
        const v=row.getAttribute('data-layer-var')||'';
        const type=row.getAttribute('data-layer-type')||'overlay';
        const group=row.getAttribute('data-layer-group')||'';
        const layer=getLayer(v);
        if(!layer)return;
        if(type==='base'){
          if(input.checked){
            layerItems.filter(x=>x.type==='base').forEach(function(item){
              if(item.var===v)return;
              const other=getLayer(item.var);
              if(other&&mapObj.hasLayer(other))mapObj.removeLayer(other);
            });
            mapObj.addLayer(layer);
          }
        }else if(input.checked){
          if(group==='all'){
            layerItems.filter(x=>x.group==='daily'||x.group==='number').forEach(function(item){
              const other=getLayer(item.var);
              if(other&&mapObj.hasLayer(other))mapObj.removeLayer(other);
            });
          }else if(group==='daily'){
            layerItems.filter(x=>x.group==='all'||x.group==='number').forEach(function(item){
              const other=getLayer(item.var);
              if(other&&mapObj.hasLayer(other))mapObj.removeLayer(other);
            });
          }else if(group==='number'){
            layerItems.filter(x=>x.group==='all'||x.group==='daily').forEach(function(item){
              const other=getLayer(item.var);
              if(other&&mapObj.hasLayer(other))mapObj.removeLayer(other);
            });
          }
          mapObj.addLayer(layer);
          if(String(layer.options&&layer.options.name||'')==='勘查編號')promoteNumberMarkers(layer);
        }else if(mapObj.hasLayer(layer)){
          mapObj.removeLayer(layer);
        }
        syncLayerChecks();
      },true);
    });
    syncLayerChecks();
    return true;
  }

  // ============================================================
  // B. 固定起點 0：一定有可點擊 Popup，且直接提供下一點入口
  // ============================================================
  function navButton(v,label){
    return v ? '<button type="button" class="cell5-nav-button cell5-final-nav-button" data-cell5-nav-marker="'+esc(v)+'">'+esc(label)+'</button>' : '';
  }
  function startPopupHtml(){
    let buttons='';
    let numberModeActive=false;
    try{
      const numberItem=(layerItems||[]).find(function(x){ return String(x&&x.group||'')==='number'; });
      if(numberItem && numberItem.var){
        const numberLayer=getLayer(numberItem.var);
        numberModeActive=!!(numberLayer && mapObj.hasLayer(numberLayer));
      }
    }catch(_){}
    if(numberModeActive){
      return '<div class="cell5-start-popup"><div style="font-size:16px;font-weight:700;margin-bottom:5px;">固定起點：0</div><div style="font-size:14px;font-weight:700;">'+esc(startDisplayName)+'</div></div>';
    }
    dailyDayTargets.forEach(function(t){
      if(t&&t.first_marker_var)buttons+=navButton(String(t.first_marker_var),String(t.day||'')+' → 1');
    });
    if(allInOneStartTarget&&allInOneStartTarget.first_marker_var)
      buttons+=navButton(String(allInOneStartTarget.first_marker_var),'一次完成 → 1');
    let h='<div class="cell5-start-popup">';
    h+='<div style="font-size:16px;font-weight:700;margin-bottom:5px;">固定起點：0</div>';
    h+='<div style="font-size:14px;font-weight:700;">'+esc(startDisplayName)+'</div>';
    if(buttons)h+='<div style="margin-top:9px;font-weight:700;">下一點</div><div class="cell5-start-day-nav">'+buttons+'</div>';
    h+='</div>';
    return h;
  }
  function bindStartMarker(){
    const m=getMarker(sharedStartMarkerVar);
    if(!m)return false;
    try{
      m.bindPopup(startPopupHtml(),{maxWidth:420});
      if(!m.__cell5FinalClickBound){
        m.__cell5FinalClickBound=true;
        m.on('click',function(){try{m.openPopup();}catch(e){}});
      }
      return true;
    }catch(e){return false;}
  }

  // ============================================================
  // C. 上一點／下一點：完全以 HTML data-cell5-nav-marker 為索引
  // ============================================================
  const oldNavigate=window.cell5NavigateInspection;
  function fallbackPanel(v){
    const panel=document.getElementById('cell5-inspection-panel');
    const body=document.getElementById('cell5-inspection-body');
    const title=document.getElementById('cell5-inspection-title');
    if(!panel||!body||!title)return;
    const meta=metaFor(v);
    let html=String(inspectionRecords[v]||'');
    title.textContent=meta.label||'勘查點資料';
    body.innerHTML=html||'<div>此點沒有可顯示資料。</div>';
    try{ body.querySelectorAll('.cell5-return-start').forEach(function(el){el.remove();}); }catch(e){}
    try{ if(mapObj.closePopup) mapObj.closePopup(); }catch(e){}
    panel.classList.add('visible');
    panel.setAttribute('aria-hidden','false');
  }
  function centerInspectionTarget(v, animate){
    try{
      const meta=metaFor(v);
      if(!Number.isFinite(meta.lat)||!Number.isFinite(meta.lon)) return false;
      // 避免連按上一點／下一點時，舊動畫把地圖中心拉回去。
      try{ if(mapObj.stop) mapObj.stop(); }catch(e){}
      const zoom=Math.max(mapObj.getZoom(),16);
      mapObj.setView([meta.lat,meta.lon],zoom,{animate:!!animate});
      return true;
    }catch(e){ return false; }
  }
  function closeAndSuspendStartPopup(){
    try{ if(mapObj && mapObj.closePopup) mapObj.closePopup(); }catch(e){}
    try{
      const sm=getMarker(sharedStartMarkerVar);
      if(sm){
        const p=sm.getPopup ? sm.getPopup() : null;
        try{ if(sm.closePopup) sm.closePopup(); }catch(e){}
        try{ if(p && mapObj && mapObj.removeLayer) mapObj.removeLayer(p); }catch(e){}
        try{ if(p && p.remove) p.remove(); }catch(e){}
        try{ if(sm.unbindPopup) sm.unbindPopup(); }catch(e){}
      }
    }catch(e){}
  }
  function restoreStartPopupLater(delay){
    setTimeout(function(){
      try{ bindStartMarker(); }catch(e){}
      try{ ensureStartMarkerInteractive(); }catch(e){}
    }, Number.isFinite(Number(delay)) ? Number(delay) : 650);
  }
  function robustNavigate(v){
    v=String(v||'');
    if(!v)return false;

    function hardCloseTargetPopups(){
      try{ if(mapObj && mapObj.closePopup) mapObj.closePopup(); }catch(e){}
      try{ const sm=getMarker(sharedStartMarkerVar); if(sm&&sm.closePopup)sm.closePopup(); }catch(e){}
      try{ const tm=getMarker(v); if(tm&&tm.closePopup)tm.closePopup(); }catch(e){}
    }

    if(v!==sharedStartMarkerVar){
      closeAndSuspendStartPopup();
    }else{
      hardCloseTargetPopups();
    }

    if(v===sharedStartMarkerVar){
      try{
        bindStartMarker();
        const sm=getMarker(v);
        if(sm&&sm.closePopup)sm.closePopup();
        if(Number.isFinite(startLat)&&Number.isFinite(startLon)){
          try{if(mapObj.stop)mapObj.stop();}catch(e){}
          mapObj.setView([startLat,startLon],Math.max(mapObj.getZoom(),16),{animate:true});
        }
        openStartPanel();
      }catch(e){}
      restoreStartPopupLater(500);
      return false;
    }

    let navigated=false;
    try{
      if(typeof oldNavigate==='function'){
        oldNavigate(v);
        navigated=true;
      }
    }catch(e){}

    if(!navigated){
      try{ fallbackPanel(v); }catch(e){}
    }

    hardCloseTargetPopups();
    try{ centerInspectionTarget(v,true); }catch(e){}
    hardCloseTargetPopups();

    setTimeout(function(){
      try{
        if(mapObj && mapObj.stop)mapObj.stop();
        hardCloseTargetPopups();
        const m=getMarker(v);
        if(m&&m.closePopup)m.closePopup();
        closeAndSuspendStartPopup();
      }catch(e){}
      try{ centerInspectionTarget(v,false); }catch(e){}
      try{ hardCloseTargetPopups(); }catch(e){}
      try{ closeAndSuspendStartPopup(); }catch(e){}
    },80);
    // v34.1：上一點／下一點導航只保留下方「勘查點資訊」面板。
    // 不再重新開啟目標 Marker 的 Leaflet Popup，避免同時出現上下兩個 popup。
    setTimeout(function(){
      try{ hardCloseTargetPopups(); }catch(e){}
      try{ closeAndSuspendStartPopup(); }catch(e){}
      try{ centerInspectionTarget(v,false); }catch(e){}
      try{ hardCloseTargetPopups(); }catch(e){}
    },420);
    setTimeout(function(){
      try{ hardCloseTargetPopups(); }catch(e){}
    },700);
    restoreStartPopupLater(900);

    return false;
  }
  window.cell5NavigateInspection=robustNavigate;
  window.cell5StartTo=robustNavigate;

  // 捕獲階段攔截 Popup / 面板內所有導航按鈕。
  document.addEventListener('click',function(e){
    const btn=e.target&&e.target.closest?e.target.closest('[data-cell5-nav-marker]'):null;
    if(!btn)return;
    const v=btn.getAttribute('data-cell5-nav-marker')||'';
    if(!v)return;
    e.preventDefault();e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    robustNavigate(v);
  },true);

  function boot(){bindLayerControls();bindStartMarker();}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
  setTimeout(boot,100);setTimeout(boot,500);setTimeout(boot,1200);

  const ni=layerItems.find(x=>String(x.label||'')==='勘查編號');
  if(ni){const nl=getLayer(ni.var);if(nl)promoteNumberMarkers(nl);}
})();
</script>
</html>
