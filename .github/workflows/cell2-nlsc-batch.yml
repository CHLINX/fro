name: Cell2 NLSC batch coordinates

on:
  workflow_dispatch:
    inputs:
      batch_json:
        description: "JSON array of parcel records: 縣市, 鄉鎮市區, 地段, 地號"
        required: true
        type: string

permissions:
  contents: read

jobs:
  nlsc-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium
      - name: Write private batch input
        env:
          BATCH_JSON: ${{ inputs.batch_json }}
        run: |
          mkdir -p input
          python - <<'PY'
          import json, os
          rows=json.loads(os.environ["BATCH_JSON"])
          if not isinstance(rows,list) or not rows:
              raise SystemExit("batch_json must be a non-empty JSON array")
          required={"縣市","鄉鎮市區","地段","地號"}
          for i,row in enumerate(rows,1):
              missing=required-set(row)
              if missing: raise SystemExit(f"row {i} missing: {sorted(missing)}")
          with open("input/parcels.json","w",encoding="utf-8") as f:
              json.dump(rows,f,ensure_ascii=False)
          print(f"Validated {len(rows)} parcel rows")
          PY
      - name: Run Cell2 batch coordinate lookup
        run: python cell2_github_batch.py
      - name: Upload coordinate results and raw NLSC responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cell2-nlsc-batch-results
          path: output/
          if-no-files-found: warn
          retention-days: 30
